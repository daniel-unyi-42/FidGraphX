services:
  fidgraphx:
    image: danielunyi42/fidgraphx
    build: .
    container_name: fidgraphx-gpu-container
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "8888:8888"
      - "6006:6006"
    volumes:
      - .:/workspace
    working_dir: /workspace
    stdin_open: true
    tty: true
    command: ["/bin/bash"]
